services:
  app:
    build: .
    container_name: gl-recon-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gl_recon
      REDIS_URL: redis://redis:6379/0
      # AI-assisted matching (Pass 3) — set your OpenRouter key here to enable it.
      # Passes 1 and 2 (exact + near-match) work without any key.
      # Free keys at https://openrouter.ai
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: nvidia/llama-3.1-nemotron-70b-instruct:free
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: gl-recon-postgres
    environment:
      POSTGRES_DB: gl_recon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gl_recon"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gl-recon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
